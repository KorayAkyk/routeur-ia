name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Installer les dépendances verrouillées
        run: make installer

      - name: Lint
        run: make lint

      - name: Types
        run: make types

      - name: Tests
        run: make test

      - name: Installer Chromium
        run: make navigateur

      - name: Parcours Playwright
        run: .venv/bin/pytest -m navigateur --tracing=retain-on-failure --output=test-results

      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-playwright
          path: test-results/
          retention-days: 7
