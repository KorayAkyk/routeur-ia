[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "routeur-ia"
version = "0.1.0"
description = "Service Flask qui route chaque demande vers le modèle Claude ou Gemini adapté, avec bascule, budget plafond et suivi des coûts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Koray Akyurek" }]
dependencies = [
    "anthropic==2.5.0",
    "flask==3.1.3",
    "google-genai==2.34.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "pydantic==2.14.3",
    "waitress==3.0.2",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "playwright==1.64.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.10.0",
    "ruff==0.17.3",
    "types-waitress==3.0.1.20260724",
]

[project.scripts]
routeur-ia = "routeur_ia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/routeur_ia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["navigateur: parcours Playwright dans un vrai navigateur"]

[tool.coverage.run]
source = ["routeur_ia"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
